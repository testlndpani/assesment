<!DOCTYPE html><html><body><div id="res">INIT</div><script>
try {
  new Function("/**\n * ============================================================================\n * GOOGLE APPS SCRIPT - MURNI AMBIL \u0026 SIMPAN DATA DARI SHEET (TANPA HARDCODE)\n * PORTAL ASESMEN \u0026 TALENTA TERPADU - PT MERDEKA GOLD RESOURCES TBK\n * ============================================================================\n * Seluruh data diambil dan disimpan 100% secara dinamis langsung dari Sheet:\n * 1. Data_Karyawan\n * 2. JSxCOMP (Matriks Kompetensi per Jabatan/Position Title \u0026 Level; fallback: Matriks_Kompetensi)\n * 3. Katalog_Modul\n * 4. Jadwal_PIN\n * 5. Bank_Soal\n * 6. Hasil_Asesmen\n * 7. Trainer_Name (fallback: List_Trainer)\n * 8. New_Register\n * 9. Company\n * 10. Departement\n * 11. Jabatan (Position Title / Position Tittle)\n * 12. Jenis_Simulator\n * 13. Hasil_Simulator\n * 14. Training_Feedback\n * ============================================================================\n */\n\nconst ALLOWED_SPREADSHEET_ID = \u0027114CzkEdLASq3EhLtTcVCoIejHVkWGSfQBG4d0thp8ew\u0027;\n\nconst SHEETS = {\n  KARYAWAN: \u0027Data_Karyawan\u0027,\n  MATRIKS: \u0027JSxCOMP\u0027,\n  MATRIKS_LEGACY: \u0027Matriks_Kompetensi\u0027,\n  MODUL: \u0027Katalog_Modul\u0027,\n  PIN: \u0027Jadwal_PIN\u0027,\n  SOAL: \u0027Bank_Soal\u0027,\n  HASIL: \u0027Hasil_Asesmen\u0027,\n  TRAINER: \u0027Trainer_Name\u0027,\n  TRAINER_LEGACY: \u0027List_Trainer\u0027,\n  NEW_REGISTER: \u0027New_Register\u0027,\n  COMPANY: \u0027Company\u0027,\n  DEPARTEMENT: \u0027Departement\u0027,\n  JABATAN: \u0027Jabatan\u0027,\n  JENIS_SIMULATOR: \u0027Jenis_Simulator\u0027,\n  HASIL_SIMULATOR: \u0027Hasil_Simulator\u0027,\n  TRAINING_FEEDBACK: \u0027Training_Feedback\u0027,\n  JADWAL_IMPORT: \u0027Jadwal_Import\u0027\n};\n\nconst FEEDBACK_HEADERS = [\n  \u0027Timestamp_Submit\u0027,\n  \u0027ID_Ujian\u0027,\n  \u0027Kode_PIN\u0027,\n  \u0027Jenis_Tes\u0027,\n  \u0027ID_Karyawan\u0027,\n  \u0027Nama_Karyawan\u0027,\n  \u0027Company\u0027,\n  \u0027Departemen\u0027,\n  \u0027Jabatan\u0027,\n  \u0027Position_Title\u0027,\n  \u0027Level\u0027,\n  \u0027ID_Modul\u0027,\n  \u0027Nama_Modul\u0027,\n  \u0027Nama_Trainer\u0027,\n  \u0027Specialist\u0027,\n  \u0027Kesesuaian_Pelatihan\u0027,\n  \u0027Kualitas_Materi\u0027,\n  \u0027Metode_Pembelajaran\u0027,\n  \u0027Fasilitas_Pelatihan\u0027,\n  \u0027Manfaat_Pelatihan\u0027,\n  \u0027Penguasaan_Materi\u0027,\n  \u0027Kemampuan_Komunikasi_Pelatih\u0027,\n  \u0027Kompetensi_Pemahaman_Pelatih\u0027,\n  \u0027Keterlibatan_Peserta\u0027,\n  \u0027Responsivitas_Pelatih\u0027,\n  \u0027Rata_Rata_Rating\u0027,\n  \u0027Perlu_Ditingkatkan\u0027,\n  \u0027Sudah_Bagus\u0027\n];\n\nconst READABLE_SHEETS = Object.keys(SHEETS).map(k =\u003e SHEETS[k]);\n// Sheet master yang aman dibaca publik\nconst PUBLIC_SHEETS = [\n  SHEETS.MATRIKS,\n  SHEETS.MATRIKS_LEGACY,\n  SHEETS.MODUL,\n  SHEETS.TRAINER,\n  SHEETS.TRAINER_LEGACY,\n  SHEETS.COMPANY,\n  SHEETS.DEPARTEMENT,\n  SHEETS.JABATAN,\n  SHEETS.JENIS_SIMULATOR,\n  SHEETS.JADWAL_IMPORT,\n  SHEETS.SOAL\n];\n// Sheet data pribadi: hanya boleh dibaca per ID_Karyawan\nconst OWNER_SHEETS = [SHEETS.HASIL, SHEETS.HASIL_SIMULATOR];\n\n/**\n * Mengambil objek Spreadsheet resmi yang telah dikunci (Locked Spreadsheet ID).\n * Mengabaikan parameter spreadsheet_url / spreadsheet_id dari luar demi keamanan.\n */\nfunction getSS() {\n  try {\n    const active = SpreadsheetApp.getActiveSpreadsheet();\n    if (active) return active;\n  } catch (e) {}\n  return SpreadsheetApp.openById(ALLOWED_SPREADSHEET_ID);\n}\n\n/**\n * Sanitasi input teks (batas panjang karakter, buang karakter kontrol berbahaya,\n * dan cegah Formula Injection =, +, -, @ di Google Sheets)\n */\nfunction cleanInput(val, maxLen) {\n  if (val === null || val === undefined) return \u0027\u0027;\n  const limit = maxLen || 150;\n  let str = String(val)\n    .replace(/[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]/g, \u0027\u0027)\n    .trim();\n  if (str.length \u003e limit) {\n    str = str.substring(0, limit);\n  }\n  return str;\n}\n\nfunction sanitizeForSheet(val) {\n  if (val === null || val === undefined) return \u0027\u0027;\n  if (typeof val === \u0027number\u0027 || typeof val === \u0027boolean\u0027) return val;\n  const str = String(val).trim();\n  if (/^[=+\\-@\\t\\r]/.test(str)) {\n    return \"\u0027\" + str;\n  }\n  return str;\n}\n\n/**\n * Rate Limiter berbasis CacheService untuk mencegah spam / flooding POST\n */\nfunction checkRateLimit(actionKey, cooldownSec) {\n  try {\n    const cache = CacheService.getScriptCache();\n    const key = \u0027MGR_RL_\u0027 + String(actionKey).replace(/[^A-Z0-9_-]/gi, \u0027\u0027).substring(0, 80);\n    if (cache.get(key)) return false;\n    cache.put(key, \u00271\u0027, cooldownSec || 4);\n  } catch (e) {}\n  return true;\n}\n\nconst CACHE_TTL_DYNAMIC = 90;\nconst CACHE_TTL_RESULTS = 45;\nconst CACHE_TTL_MASTER = 300;\nconst CACHE_CHUNK_LIMIT = 85000;\nconst CACHE_MAX_CHUNKS = 14;\nconst _MEM_SHEET_CACHE = {};\nconst _SHEET_FROM_CACHE = {};\n\nconst MASTER_CACHE_SHEETS = [\n  SHEETS.MATRIKS,\n  SHEETS.MATRIKS_LEGACY,\n  SHEETS.MODUL,\n  SHEETS.TRAINER,\n  SHEETS.TRAINER_LEGACY,\n  SHEETS.COMPANY,\n  SHEETS.DEPARTEMENT,\n  SHEETS.JABATAN,\n  SHEETS.JENIS_SIMULATOR\n];\n\nconst CACHEABLE_SHEETS = MASTER_CACHE_SHEETS.concat([\n  SHEETS.PIN,\n  SHEETS.SOAL,\n  SHEETS.KARYAWAN,\n  SHEETS.NEW_REGISTER,\n  SHEETS.JADWAL_IMPORT,\n  SHEETS.HASIL,\n  SHEETS.HASIL_SIMULATOR\n]);\n\nfunction getSheetCacheTtl(sheetName) {\n  if (MASTER_CACHE_SHEETS.indexOf(sheetName) !== -1) return CACHE_TTL_MASTER;\n  if (sheetName === SHEETS.HASIL || sheetName === SHEETS.HASIL_SIMULATOR) return CACHE_TTL_RESULTS;\n  return CACHE_TTL_DYNAMIC;\n}\n\nfunction getChunkedCache(cacheKey) {\n  try {\n    const cache = CacheService.getScriptCache();\n    const metaRaw = cache.get(cacheKey + \u0027_m\u0027);\n    if (metaRaw) {\n      const meta = JSON.parse(metaRaw);\n      const n = meta \u0026\u0026 meta.n ? meta.n : 0;\n      if (n \u003e 0 \u0026\u0026 n \u003c= CACHE_MAX_CHUNKS) {\n        const keys = [];\n        for (let i = 0; i \u003c n; i++) keys.push(cacheKey + \u0027_\u0027 + i);\n        const batch = cache.getAll(keys);\n        let joined = \u0027\u0027;\n        for (let i = 0; i \u003c n; i++) {\n          if (batch[keys[i]] === undefined || batch[keys[i]] === null) return null;\n          joined += batch[keys[i]];\n        }\n        let jsonStr = joined;\n        if (meta.gz) {\n          const bytes = Utilities.base64Decode(joined);\n          const gzBlob = Utilities.newBlob(bytes, \u0027application/x-gzip\u0027);\n          jsonStr = Utilities.ungzip(gzBlob).getDataAsString(\u0027UTF-8\u0027);\n        }\n        return JSON.parse(jsonStr);\n      }\n    }\n    const legacy = cache.get(cacheKey);\n    if (legacy) return JSON.parse(legacy);\n  } catch (e) {}\n  return null;\n}\n\nfunction putChunkedCache(cacheKey, data, ttlSec) {\n  try {\n    const cache = CacheService.getScriptCache();\n    let payload = JSON.stringify(data);\n    let isGz = 0;\n    try {\n      const zipped = Utilities.gzip(Utilities.newBlob(payload, \u0027text/plain; charset=utf-8\u0027));\n      const b64 = Utilities.base64Encode(zipped.getBytes());\n      if (b64 \u0026\u0026 b64.length \u003c payload.length) {\n        payload = b64;\n        isGz = 1;\n      }\n    } catch (ge) {}\n\n    if (!isGz \u0026\u0026 payload.length \u003c CACHE_CHUNK_LIMIT) {\n      cache.put(cacheKey, payload, ttlSec);\n      return;\n    }\n\n    const totalChunks = Math.ceil(payload.length / CACHE_CHUNK_LIMIT);\n    if (totalChunks \u003e CACHE_MAX_CHUNKS) return;\n\n    const batch = {};\n    batch[cacheKey + \u0027_m\u0027] = JSON.stringify({ n: totalChunks, gz: isGz });\n    for (let i = 0; i \u003c totalChunks; i++) {\n      batch[cacheKey + \u0027_\u0027 + i] = payload.slice(i * CACHE_CHUNK_LIMIT, (i + 1) * CACHE_CHUNK_LIMIT);\n    }\n    cache.putAll(batch, ttlSec);\n  } catch (e) {}\n}\n\n/**\n * Membaca seluruh baris dari Sheet secara dinamis menjadi Array of Objects (JSON)\n * Dilengkapi in-memory cache per eksekusi + compressed chunked CacheService agar sheet besar (\u003e95 KB) tetap ter-cache.\n */\nfunction getSheetData(ss, sheetName, bypassCache) {\n  const useCache = !bypassCache \u0026\u0026 CACHEABLE_SHEETS.indexOf(sheetName) !== -1;\n  const cacheKey = \u0027MGR_SH_\u0027 + sheetName;\n\n  if (useCache \u0026\u0026 _MEM_SHEET_CACHE[sheetName]) {\n    return _MEM_SHEET_CACHE[sheetName];\n  }\n\n  if (useCache) {\n    const cached = getChunkedCache(cacheKey);\n    if (cached) {\n      _MEM_SHEET_CACHE[sheetName] = cached;\n      _SHEET_FROM_CACHE[sheetName] = true;\n      return cached;\n    }\n  }\n\n  _SHEET_FROM_CACHE[sheetName] = false;\n  const sheet = ss.getSheetByName(sheetName);\n  if (!sheet) return [];\n\n  const lastRow = sheet.getLastRow();\n  const lastCol = sheet.getLastColumn();\n  if (lastRow \u003c 1 || lastCol \u003c 1) return [];\n\n  const values = sheet.getRange(1, 1, lastRow, lastCol).getDisplayValues();\n  let headers = values[0].map(h =\u003e String(h).trim());\n  let rows = values.slice(1);\n\n  // Dukungan sheet daftar 1 kolom bila baris ke-1 belum diberi header (misal langsung \"Supervisor\")\n  const singleColLists = [SHEETS.JABATAN, SHEETS.COMPANY, SHEETS.DEPARTEMENT, SHEETS.JENIS_SIMULATOR];\n  if (lastCol === 1 \u0026\u0026 singleColLists.indexOf(sheetName) !== -1) {\n    const firstVal = headers[0];\n    const isHeaderWord = /^(no|id|company|nama_company|department|departement|departemen|jabatan|position\\s*titt?le|job\\s*titt?le|clear\\s*position|level|status_level|jenis_simulator|nama_simulator|simulator)$/i.test(firstVal);\n    if (firstVal \u0026\u0026 !isHeaderWord) {\n      headers = [sheetName === SHEETS.JABATAN ? \u0027Position Title\u0027 : sheetName];\n      rows = values;\n    }\n  } else if (lastRow \u003c 2) {\n    return [];\n  }\n\n  const hasNfcCol = headers.some(h =\u003e /^(nfc_uid|nfc\\s*uid|uid_nfc|nfc|uid)$/i.test(h));\n  const result = rows\n    .filter(row =\u003e row.some(cell =\u003e String(cell).trim() !== \u0027\u0027))\n    .map(row =\u003e {\n      const obj = {};\n      headers.forEach((header, idx) =\u003e {\n        if (header) obj[header] = row[idx] !== undefined ? row[idx] : \u0027\u0027;\n      });\n      // Dukungan NFC legacy: hanya aktif bila header NFC_UID belum tersedia \u0026 nilai bukan URL/level\n      if (sheetName === SHEETS.KARYAWAN \u0026\u0026 !hasNfcCol \u0026\u0026 row[8] !== undefined) {\n        const valColI = String(row[8]).trim();\n        if (valColI \u0026\u0026 !/^https?:\\/\\//i.test(valColI) \u0026\u0026 !/^level/i.test(valColI)) {\n          obj.NFC_UID = obj.NFC_UID || valColI;\n          obj._col_I = valColI;\n        }\n      }\n      return obj;\n    });\n\n  if (CACHEABLE_SHEETS.indexOf(sheetName) !== -1) {\n    _MEM_SHEET_CACHE[sheetName] = result;\n    putChunkedCache(cacheKey, result, getSheetCacheTtl(sheetName));\n  }\n\n  return result;\n}\n\nfunction invalidateSheetCache(sheetName) {\n  try {\n    delete _MEM_SHEET_CACHE[sheetName];\n    delete _SHEET_FROM_CACHE[sheetName];\n    const cacheKey = \u0027MGR_SH_\u0027 + sheetName;\n    const keys = [cacheKey, cacheKey + \u0027_m\u0027];\n    for (let i = 0; i \u003c CACHE_MAX_CHUNKS; i++) keys.push(cacheKey + \u0027_\u0027 + i);\n    CacheService.getScriptCache().removeAll(keys);\n  } catch (e) {}\n}\n\nfunction findKaryawanInSheets(ss, keysOrQuery, allowFreshRetry) {\n  const queries = Array.isArray(keysOrQuery) ? keysOrQuery.filter(Boolean) : [keysOrQuery];\n  if (!queries.length) return null;\n\n  const tryFind = function(bypass) {\n    const kar = getSheetData(ss, SHEETS.KARYAWAN, bypass);\n    const nr = getSheetData(ss, SHEETS.NEW_REGISTER, bypass);\n    const combined = kar.concat(nr);\n    for (let i = 0; i \u003c queries.length; i++) {\n      const hit = findKaryawanByKey(combined, queries[i]);\n      if (hit) return hit;\n    }\n    return null;\n  };\n\n  const cachedHit = tryFind(false);\n  if (cachedHit) return cachedHit;\n\n  if (allowFreshRetry) {\n    const wasCached = _SHEET_FROM_CACHE[SHEETS.KARYAWAN] || _SHEET_FROM_CACHE[SHEETS.NEW_REGISTER];\n    if (wasCached) return tryFind(true);\n  }\n  return null;\n}\n\n/**\n * Mengambil daftar Trainer dari Sheet Trainer_Name (No, Name, Specialist)\n * dengan fallback ke Sheet List_Trainer jika Trainer_Name belum tersedia/kosong.\n */\nfunction getTrainerData(ss, bypassCache) {\n  let rows = getSheetData(ss, SHEETS.TRAINER, bypassCache);\n  if (!rows || !rows.length) {\n    rows = getSheetData(ss, SHEETS.TRAINER_LEGACY, bypassCache);\n  }\n  return (rows || []).map((r, idx) =\u003e {\n    const no = String(r.No || r.no || r.NO || (idx + 1)).trim();\n    const name = String(r.Name || r.name || r.NAME || r.Nama_Trainer || r.nama_trainer || r.Nama || r.Trainer || \u0027\u0027).trim();\n    const specialist = String(r.Specialist || r.specialist || r.SPECIALIST || r.Spesialis || r.spesialis || r.Keahlian || r.Bidang || \u0027\u0027).trim();\n    return Object.assign({}, r, {\n      No: no,\n      Name: name,\n      Nama_Trainer: name,\n      Specialist: specialist\n    });\n  }).filter(r =\u003e r.Name);\n}\n\n/**\n * Mengambil seluruh identifier karyawan (ID_Karyawan, NIK, nik_KTP, No_KTP, No_HP, ID_Employee, Username)\n * secara case-insensitive termasuk segmen yang dipisah \"/\" (mis. \"260494/082157973030/6408181204980001\")\n */\nfunction getEmployeeIds(obj) {\n  if (!obj || typeof obj !== \u0027object\u0027) return [];\n  const keyPattern = /^(id_karyawan|id_employee|employee_id|nik|nik_ktp|no_ktp|nomor_ktp|ktp|no_hp|hp|no_telp|telepon|username|id)$/i;\n  const seen = {};\n  const out = [];\n  const addId = val =\u003e {\n    const raw = String(val || \u0027\u0027).trim().toLowerCase();\n    if (!raw) return;\n    if (!seen[raw]) { seen[raw] = true; out.push(raw); }\n    raw.split(/[\\/|,;]+/).forEach(part =\u003e {\n      const p = part.trim();\n      if (p.length \u003e= 3 \u0026\u0026 !seen[p]) { seen[p] = true; out.push(p); }\n    });\n  };\n  Object.keys(obj).forEach(k =\u003e {\n    const kNorm = String(k).trim().replace(/\\s+/g, \u0027_\u0027);\n    if (keyPattern.test(kNorm) \u0026\u0026 obj[k] !== undefined \u0026\u0026 obj[k] !== null) {\n      addId(obj[k]);\n    }\n  });\n  return out;\n}\n\nfunction matchesEmployeeIds(row, empIds) {\n  if (!row || !empIds || !empIds.length) return false;\n  const rowIds = getEmployeeIds(row);\n  return rowIds.some(rid =\u003e empIds.indexOf(rid) !== -1);\n}\n\n/**\n * Mencocokkan apakah karyawan yang login terdaftar di Sheet Trainer_Name\n */\nfunction matchTrainerAccount(trainerList, namaLengkap, idOrIds) {\n  const norm = s =\u003e String(s || \u0027\u0027).trim().toUpperCase().replace(/\\s+/g, \u0027 \u0027);\n  const qName = norm(namaLengkap);\n  const qIds = (Array.isArray(idOrIds) ? idOrIds : [idOrIds]).map(norm).filter(Boolean);\n  if (!qName \u0026\u0026 !qIds.length) return null;\n  return (trainerList || []).find(t =\u003e {\n    const tName = norm(t.Name || t.Nama_Trainer || \u0027\u0027);\n    const tIds = [t.ID_Employee, t.ID_Karyawan, t.NIK, t.nik_KTP, t.NIK_KTP, t.ID, t.No].map(norm).filter(Boolean);\n    if (qName \u0026\u0026 tName \u0026\u0026 qName === tName) return true;\n    if (qIds.length \u0026\u0026 tIds.some(tid =\u003e qIds.indexOf(tid) !== -1)) return true;\n    return false;\n  }) || null;\n}\n\n/**\n * Helper field profil karyawan lintas variasi header (Company, Departemen, Position Title / Jabatan, Level / Status_Level)\n */\nfunction getEmpCompany(o) {\n  if (!o || typeof o !== \u0027object\u0027) return \u0027\u0027;\n  return String(o.Company || o.company || o.Nama_Company || o.nama_company || o.Perusahaan || o.Nama_Perusahaan || \u0027\u0027).trim();\n}\n\nfunction getEmpDept(o) {\n  if (!o || typeof o !== \u0027object\u0027) return \u0027\u0027;\n  return String(o.Departemen || o.departemen || o.Department || o.department || o.Departement || o.departement || o.Nama_Departemen || o.Nama_Departement || \u0027\u0027).trim();\n}\n\nfunction getEmpPosition(o) {\n  if (!o || typeof o !== \u0027object\u0027) return \u0027\u0027;\n  return String(\n    o[\u0027Position Title\u0027] || o[\u0027Position Tittle\u0027] || o.Position_Title || o.Position_Tittle ||\n    o.position_title || o.position_tittle || o[\u0027Job Title\u0027] || o[\u0027Job Tittle\u0027] ||\n    o.Job_Title || o[\u0027Clear Position\u0027] || o.Clear_Position ||\n    o.Jabatan || o.jabatan || o.Nama_Jabatan || o.Posisi || \u0027\u0027\n  ).trim();\n}\n\nfunction getEmpLevel(o) {\n  if (!o || typeof o !== \u0027object\u0027) return \u0027\u0027;\n  return String(o.Level || o.LEVEL || o.level || o.Status_Level || o.status_level || o[\u0027Status Level\u0027] || \u0027\u0027).trim();\n}\n\nfunction normDeptKey(s) {\n  const k = String(s || \u0027\u0027).toLowerCase().replace(/\u0026/g, \u0027and\u0027).replace(/[^a-z0-9]/g, \u0027\u0027);\n  if (k === \u0027environment\u0027) return \u0027environmental\u0027;\n  return k;\n}\n\nfunction normPosKey(s) {\n  return String(s || \u0027\u0027)\n    .toLowerCase()\n    .replace(/infrastructureee/g, \u0027infrastructure\u0027)\n    .replace(/electrcian/g, \u0027electrician\u0027)\n    .replace(/cainsaw/g, \u0027chainsaw\u0027)\n    .replace(/[^a-z0-9]/g, \u0027\u0027);\n}\n\nfunction normLevelToken(s) {\n  const raw = String(s || \u0027\u0027).trim().toLowerCase();\n  if (!raw) return \u0027\u0027;\n  const cl = raw.replace(/[^a-z0-9]/g, \u0027\u0027);\n  if (cl === \u0027generalmanager\u0027 || cl === \u0027gm\u0027 || raw.indexOf(\u0027general manager\u0027) !== -1 || raw.indexOf(\u0027executive committee\u0027) !== -1) return \u0027generalmanager\u0027;\n  if (cl === \u0027seniormanager\u0027 || cl === \u0027srmanager\u0027 || raw.indexOf(\u0027senior manager\u0027) !== -1 || /\\bsr\\.?\\s*manager\\b/.test(raw)) return \u0027seniormanager\u0027;\n  if (cl === \u0027superintendent\u0027 || raw.indexOf(\u0027superintendent\u0027) !== -1) return \u0027superintendent\u0027;\n  if (cl === \u0027manager\u0027 || cl === \u0027asstmgr\u0027 || /\\bmanager\\b/.test(raw) || /\\basst\\.?\\s*mgr\\b/.test(raw)) return \u0027manager\u0027;\n  if (raw.indexOf(\u0027junior instructor\u0027) !== -1) return \u0027officer\u0027;\n  if (cl === \u0027supervisor\u0027 || raw.indexOf(\u0027supervisor\u0027) !== -1 || raw.indexOf(\u0027instructor\u0027) !== -1) return \u0027supervisor\u0027;\n  if (cl === \u0027officer\u0027 || /\\b(officer|coordinator|foreman|engineer|specialist|admin|planner|scheduler|surveyor|geologist|dispatcher)\\b/.test(raw)) return \u0027officer\u0027;\n  if (cl === \u0027nonstaff\u0027 || /\\b(non[\\s-]*staff|crew|operator|driver|helper|electrician|mechanic|technician|welder|carpenter|plumber|scaffolder|rigger|serviceman|storeman|tyreman)\\b/.test(raw)) return \u0027nonstaff\u0027;\n  return \u0027\u0027;\n}\n\nfunction resolveEmpLevelKey(profil) {\n  const explicit = normLevelToken(getEmpLevel(profil));\n  if (explicit) return explicit;\n  return normLevelToken(getEmpPosition(profil));\n}\n\nfunction normTrainingInfo(s) {\n  const raw = String(s || \u0027\u0027)\n    .toLowerCase()\n    .replace(/hegiht/g, \u0027height\u0027)\n    .replace(/proicessing/g, \u0027processing\u0027)\n    .replace(/geosience/g, \u0027geoscience\u0027)\n    .replace(/induski/g, \u0027induksi\u0027)\n    .replace(/\\*/g, \u0027 \u0027)\n    .replace(/\\binduksi\\s+hr\\b/g, \u0027hr induction\u0027)\n    .replace(/\\b(?:induksi\\s+general\\s+ohse?|general\\s+ohse?\\s+induc(?:tion|si))\\b/g, \u0027general ohs induction\u0027);\n  const digits = (raw.match(/\\d+/g) || []).join(\u0027,\u0027);\n  const paren = [];\n  raw.replace(/\\(([^)]+)\\)/g, function(_, g) {\n    const p = g.replace(/[^a-z0-9]/g, \u0027\u0027);\n    if (p.length \u003e= 2) paren.push(p);\n    return \u0027 \u0027;\n  });\n  const stripped = raw\n    .replace(/\\(([^)]+)\\)/g, \u0027 \u0027)\n    .replace(/\\b(training|workshop|awareness|kelas|tambahan|request|mcc|and)\\b/g, \u0027 \u0027)\n    .replace(/[^a-z0-9]/g, \u0027\u0027);\n  const fullClean = raw.replace(/[^a-z0-9]/g, \u0027\u0027);\n  return { fullClean: fullClean, core: stripped || fullClean, paren: paren, digits: digits };\n}\n\nfunction matchTrainingNames(a, b) {\n  const ia = normTrainingInfo(a);\n  const ib = normTrainingInfo(b);\n  if (!ia.fullClean || !ib.fullClean) return false;\n  if (ia.fullClean === ib.fullClean || ia.core === ib.core) return true;\n  if (ia.digits !== ib.digits) return false;\n  if (ia.paren.some(function(p) { return p === ib.core || p === ib.fullClean || ib.paren.indexOf(p) !== -1; })) return true;\n  if (ib.paren.some(function(p) { return p === ia.core || p === ia.fullClean; })) return true;\n  if (ia.core.length \u003e= 6 \u0026\u0026 ib.core.length \u003e= 6) {\n    if (ia.core.indexOf(ib.core) !== -1 || ib.core.indexOf(ia.core) !== -1) return true;\n  }\n  return false;\n}\n\n/**\n * Membangun Matriks Kompetensi dinamis per karyawan dari Sheet JSxCOMP\n * (+ enrichment kode/masa berlaku dari Matriks_Kompetensi jika masih ada, \u0026 status LULUS dari Hasil_Asesmen)\n */\nfunction buildEmployeeMatrix(ss, profil, empIds, histori, masterBypass) {\n  const jsxRows = getSheetData(ss, SHEETS.MATRIKS, Boolean(masterBypass));\n  const legRows = SHEETS.MATRIKS_LEGACY ? getSheetData(ss, SHEETS.MATRIKS_LEGACY, Boolean(masterBypass)) : [];\n  const modulRows = getSheetData(ss, SHEETS.MODUL, Boolean(masterBypass));\n\n  // Kompatibilitas mundur: jika ada baris per-NIK eksplisit di legacy Matriks_Kompetensi\n  const legacyPersonal = (legRows || []).filter(function(m) { return matchesEmployeeIds(m, empIds); });\n  const isJsxSchema = (jsxRows || []).some(function(r) {\n    return r[\u0027Nama Training\u0027] !== undefined || r[\u0027Job Title\u0027] !== undefined || r[\u0027Clear Position\u0027] !== undefined;\n  });\n\n  if (!isJsxSchema) {\n    const direct = jsxRows.filter(function(m) { return matchesEmployeeIds(m, empIds); });\n    if (direct.length) return direct;\n    if (legacyPersonal.length) return legacyPersonal;\n  }\n\n  const infoMemo = {};\n  const getInfo = function(s) {\n    const k = String(s || \u0027\u0027);\n    if (!infoMemo[k]) infoMemo[k] = normTrainingInfo(k);\n    return infoMemo[k];\n  };\n\n  // Pre-index O(1) Katalog_Modul dan katalog Matriks_Kompetensi lama\n  const modExactMap = {};\n  const modCoreMap = {};\n  (modulRows || []).forEach(function(m) {\n    [m.ID_Modul, m.Nama_Modul].forEach(function(nm) {\n      if (!nm) return;\n      const inf = getInfo(nm);\n      if (inf.fullClean \u0026\u0026 !modExactMap[inf.fullClean]) modExactMap[inf.fullClean] = m;\n      if (inf.core \u0026\u0026 !modCoreMap[inf.core]) modCoreMap[inf.core] = m;\n    });\n  });\n\n  const catMeta = [];\n  const catExactMap = {};\n  const catCoreMap = {};\n  (legRows || []).forEach(function(r) {\n    const nm = String(r[\u0027NAMA KOMPETENSI\u0027] || r.Nama_Kompetensi || \u0027\u0027).trim();\n    if (!nm) return;\n    const entry = {\n      name: nm,\n      kode: String(r[\u0027KODE KOMPETENSI MDKA\u0027] || r[\u0027KODE KOMPETENSI PANI\u0027] || \u0027\u0027).replace(/^-$/, \u0027\u0027).trim(),\n      kodePani: String(r[\u0027KODE KOMPETENSI PANI\u0027] || \u0027\u0027).replace(/^-$/, \u0027\u0027).trim(),\n      typeTraining: String(r[\u0027TYPE TRAINING\u0027] || \u0027\u0027).trim(),\n      durasi: String(r[\u0027DURASI TRAINING\u0027] || \u0027\u0027).trim(),\n      masaBerlaku: String(r[\u0027MASA BERLAKU / TAHUN\u0027] || \u0027\u0027).trim()\n    };\n    catMeta.push(entry);\n    const inf = getInfo(nm);\n    if (inf.fullClean \u0026\u0026 !catExactMap[inf.fullClean]) catExactMap[inf.fullClean] = entry;\n    if (inf.core \u0026\u0026 !catCoreMap[inf.core]) catCoreMap[inf.core] = entry;\n  });\n\n  const empDept = normDeptKey(getEmpDept(profil));\n  const empPos = normPosKey(getEmpPosition(profil));\n  const empLvl = resolveEmpLevelKey(profil);\n\n  let selected = [];\n  if (isJsxSchema) {\n    const cleanRows = jsxRows.filter(function(r) { return String(r[\u0027Nama Training\u0027] || \u0027\u0027).trim() !== \u0027\u0027; });\n    const deptJobMatches = (empDept \u0026\u0026 empPos)\n      ? cleanRows.filter(function(r) {\n          return normDeptKey(r.Department) === empDept \u0026\u0026 normPosKey(r[\u0027Job Title\u0027]) === empPos;\n        })\n      : [];\n    const anyJobMatches = (!deptJobMatches.length \u0026\u0026 empPos)\n      ? cleanRows.filter(function(r) { return normPosKey(r[\u0027Job Title\u0027]) === empPos; })\n      : [];\n    const exactJobs = deptJobMatches.length ? deptJobMatches : anyJobMatches;\n\n    if (exactJobs.length) {\n      const roleLevels = {};\n      const roleClearPos = {};\n      if (empLvl) roleLevels[empLvl] = true;\n      exactJobs.forEach(function(r) {\n        const lv = normLevelToken(r.Level);\n        const cp = normPosKey(r[\u0027Clear Position\u0027]);\n        if (lv) roleLevels[lv] = true;\n        if (cp) roleClearPos[cp] = true;\n      });\n      selected = cleanRows.filter(function(r) {\n        const rDept = normDeptKey(r.Department);\n        const rJob = normPosKey(r[\u0027Job Title\u0027]);\n        const rClear = normPosKey(r[\u0027Clear Position\u0027]);\n        const rLvl = normLevelToken(r.Level);\n        if (exactJobs.indexOf(r) !== -1) return true;\n        if (empDept \u0026\u0026 rDept === empDept \u0026\u0026 !rJob \u0026\u0026 ((rClear \u0026\u0026 roleClearPos[rClear]) || (rLvl \u0026\u0026 roleLevels[rLvl]))) return true;\n        if (!rDept \u0026\u0026 !rJob \u0026\u0026 ((rLvl \u0026\u0026 roleLevels[rLvl]) || (rClear \u0026\u0026 roleLevels[normLevelToken(r[\u0027Clear Position\u0027])]))) return true;\n        return false;\n      });\n    } else if (empDept \u0026\u0026 (empPos || empLvl)) {\n      const clearMatches = empPos\n        ? cleanRows.filter(function(r) { return normDeptKey(r.Department) === empDept \u0026\u0026 normPosKey(r[\u0027Clear Position\u0027]) === empPos; })\n        : [];\n      const targetLvl = empLvl || (clearMatches.length ? normLevelToken(clearMatches[0].Level) : \u0027\u0027);\n      selected = cleanRows.filter(function(r) {\n        const rDept = normDeptKey(r.Department);\n        const rJob = normPosKey(r[\u0027Job Title\u0027]);\n        const rClear = normPosKey(r[\u0027Clear Position\u0027]);\n        const rLvl = normLevelToken(r.Level);\n        if (clearMatches.indexOf(r) !== -1) return true;\n        if (rDept === empDept \u0026\u0026 !rJob) {\n          if (targetLvl) return rLvl === targetLvl || normLevelToken(r[\u0027Clear Position\u0027]) === targetLvl;\n          return true;\n        }\n        if (!rDept \u0026\u0026 !rJob) {\n          return targetLvl ? (rLvl === targetLvl || normLevelToken(r[\u0027Clear Position\u0027]) === targetLvl) : /manda/i.test(String(r.Kategori || \u0027\u0027));\n        }\n        return false;\n      });\n    } else if (empDept) {\n      selected = cleanRows.filter(function(r) {\n        const rDept = normDeptKey(r.Department);\n        const rLvl = normLevelToken(r.Level);\n        if (rDept === empDept) return true;\n        if (!rDept) return empLvl ? rLvl === empLvl : /manda/i.test(String(r.Kategori || \u0027\u0027));\n        return false;\n      });\n    } else if (empLvl) {\n      selected = cleanRows.filter(function(r) {\n        return !normDeptKey(r.Department) \u0026\u0026 normLevelToken(r.Level) === empLvl;\n      });\n    }\n\n    if (!selected.length) {\n      selected = cleanRows.filter(function(r) { return !normDeptKey(r.Department) \u0026\u0026 /manda/i.test(String(r.Kategori || \u0027\u0027)); });\n    }\n  }\n\n  // Deduplikasi berdasarkan nama training, utamakan Mandatory \u0026 aturan spesifik departemen\n  const dedupMap = {};\n  const dedupList = [];\n  selected.forEach(function(r) {\n    const namaTr = String(r[\u0027Nama Training\u0027] || \u0027\u0027).trim();\n    if (!namaTr) return;\n    const tKey = normTrainingInfo(namaTr).fullClean;\n    const rawKat = String(r.Kategori || \u0027\u0027).trim();\n    const isMand = /non[-\\s]*manda/i.test(rawKat) ? false : /manda/i.test(rawKat);\n    const katLabel = isMand ? \u0027Mandatory\u0027 : (rawKat || \u0027Non-Mandatory\u0027);\n    const intExt = String(r[\u0027Internal/External\u0027] || \u0027\u0027).trim().toUpperCase();\n    const score = (isMand ? 4 : 0) + (normDeptKey(r.Department) ? 2 : 0) + (normPosKey(r[\u0027Job Title\u0027]) ? 1 : 0);\n\n    if (dedupMap[tKey]) {\n      if (score \u003e dedupMap[tKey]._score) {\n        dedupMap[tKey].Kategori = katLabel;\n        if (intExt) dedupMap[tKey].Internal_External = intExt;\n        if (r[\u0027Job Title\u0027]) dedupMap[tKey].Job_Title = String(r[\u0027Job Title\u0027]).trim();\n        dedupMap[tKey]._score = score;\n      }\n      return;\n    }\n\n    const trInfo = getInfo(namaTr);\n    const modMatch = modExactMap[trInfo.fullClean] || modCoreMap[trInfo.core] || (modulRows || []).find(function(m) {\n      return matchTrainingNames(m.ID_Modul, namaTr) || matchTrainingNames(m.Nama_Modul, namaTr);\n    });\n    const catMatch = catExactMap[trInfo.fullClean] || catCoreMap[trInfo.core] || catMeta.find(function(c) {\n      return matchTrainingNames(c.name, namaTr);\n    });\n    const kodeKomp = (catMatch \u0026\u0026 (catMatch.kode || catMatch.kodePani)) || \u0027\u0027;\n\n    const item = {\n      ID_Modul: modMatch ? modMatch.ID_Modul : namaTr,\n      Kode_Kompetensi: kodeKomp,\n      Nama_Kompetensi: namaTr,\n      Kategori: katLabel,\n      Internal_External: intExt,\n      Department: String(r.Department || \u0027\u0027).trim(),\n      Job_Title: String(r[\u0027Job Title\u0027] || r[\u0027Clear Position\u0027] || \u0027\u0027).trim(),\n      Level: String(r.Level || \u0027\u0027).trim(),\n      Durasi: (catMatch \u0026\u0026 catMatch.durasi) || \u0027\u0027,\n      Masa_Berlaku_Tahun: (catMatch \u0026\u0026 catMatch.masaBerlaku) || \u0027\u0027,\n      Status: \u0027NOT YET\u0027,\n      Skor: \u0027\u0027,\n      Tgl_Selesai: \u0027\u0027,\n      cert: \u0027\u0027,\n      _score: score\n    };\n    dedupMap[tKey] = item;\n    dedupList.push(item);\n  });\n\n  if (!dedupList.length) {\n    (modulRows || []).forEach(function(m, idx) {\n      dedupList.push({\n        ID_Modul: m.ID_Modul,\n        Kode_Kompetensi: \u0027KOMP-\u0027 + (idx + 1),\n        Nama_Kompetensi: m.Nama_Modul || m.ID_Modul,\n        Kategori: \u0027Mandatory\u0027,\n        Internal_External: \u0027INTERNAL\u0027,\n        Status: \u0027NOT YET\u0027,\n        Skor: \u0027\u0027,\n        Tgl_Selesai: \u0027\u0027,\n        cert: \u0027\u0027\n      });\n    });\n  }\n\n  // Sinkronkan status DONE dengan Hasil_Asesmen milik karyawan\n  const lulusList = (histori || []).filter(function(h) {\n    return String(h.Status_Lulus || \u0027\u0027).trim().toUpperCase() === \u0027LULUS\u0027;\n  });\n  const absenList = (histori || []).filter(function(h) {\n    return String(h.Status_Lulus || \u0027\u0027).trim().toUpperCase() === \u0027HANYA ABSEN\u0027;\n  });\n\n  dedupList.forEach(function(item, idx) {\n    delete item._score;\n    if (!item.Kode_Kompetensi) item.Kode_Kompetensi = \u0027COMP-\u0027 + (idx + 1);\n    const matches = lulusList.filter(function(h) {\n      return matchTrainingNames(h.ID_Modul, item.ID_Modul) ||\n        matchTrainingNames(h.Nama_Modul_Sertifikat, item.Nama_Kompetensi) ||\n        matchTrainingNames(h.ID_Modul, item.Nama_Kompetensi);\n    }).sort(function(a, b) {\n      return (parseFloat(b.Skor_Akhir) || 0) - (parseFloat(a.Skor_Akhir) || 0);\n    });\n    if (matches.length) {\n      const best = matches[0];\n      item.Status = \u0027DONE\u0027;\n      item.Skor = best.Skor_Akhir;\n      item.Tgl_Selesai = best.Tanggal_Training || String(best.Timestamp_Submit || \u0027\u0027).split(\u0027 \u0027)[0];\n      item.cert = best.No_Sertifikat || \u0027\u0027;\n    } else {\n      const absenMatch = absenList.find(function(h) {\n        return matchTrainingNames(h.ID_Modul, item.ID_Modul) ||\n          matchTrainingNames(h.Nama_Modul_Sertifikat, item.Nama_Kompetensi) ||\n          matchTrainingNames(h.ID_Modul, item.Nama_Kompetensi);\n      });\n      if (absenMatch) {\n        item.Absen_Hadir = true;\n        item.Tgl_Absen = absenMatch.Tanggal_Training || String(absenMatch.Timestamp_Submit || \u0027\u0027).split(\u0027 \u0027)[0];\n      }\n    }\n  });\n\n  dedupList.sort(function(a, b) {\n    const am = /non[-\\s]*manda/i.test(a.Kategori) ? 1 : 0;\n    const bm = /non[-\\s]*manda/i.test(b.Kategori) ? 1 : 0;\n    if (am !== bm) return am - bm;\n    return String(a.Nama_Kompetensi).localeCompare(String(b.Nama_Kompetensi));\n  });\n\n  return dedupList;\n}\n\n/**\n * Memastikan kolom Nama_Trainer dan Specialist tersedia di Sheet Hasil_Asesmen\n */\nfunction ensureHasilTrainerHeaders(sheetHasil, includeTanggal) {\n  if (!sheetHasil) return;\n  let lastCol = sheetHasil.getLastColumn();\n  if (lastCol \u003c= 0) return;\n  const existingHeaders = sheetHasil.getRange(1, 1, 1, lastCol).getValues()[0].map(h =\u003e String(h || \u0027\u0027).trim());\n  if (includeTanggal \u0026\u0026 !existingHeaders.some(h =\u003e /^(tanggal_training|tgl_training|tanggal)$/i.test(h))) {\n    lastCol++;\n    sheetHasil.getRange(1, lastCol).setValue(\u0027Tanggal_Training\u0027);\n  }\n  if (!existingHeaders.some(h =\u003e /^(nama_trainer|trainer_name|trainer|name)$/i.test(h))) {\n    lastCol++;\n    sheetHasil.getRange(1, lastCol).setValue(\u0027Nama_Trainer\u0027);\n  }\n  if (!existingHeaders.some(h =\u003e /^(specialist|specialist_trainer|spesialis)$/i.test(h))) {\n    lastCol++;\n    sheetHasil.getRange(1, lastCol).setValue(\u0027Specialist\u0027);\n  }\n  if (!existingHeaders.some(h =\u003e /^(jenis_tes|jenis_test|tipe_tes|tipe_test|test_type)$/i.test(h))) {\n    lastCol++;\n    sheetHasil.getRange(1, lastCol).setValue(\u0027Jenis_Tes\u0027);\n  }\n}\n\n/**\n * Memastikan kolom Batas_Pre_Test (default 1) dan Batas_Post_Test (default 2)\n * tersedia tepat di samping kolom Jml_Soal pada Sheet Jadwal_PIN\n */\nfunction ensureJadwalPinLimitHeaders(sheetPin) {\n  if (!sheetPin) return false;\n  const lastCol = sheetPin.getLastColumn();\n  const lastRow = sheetPin.getLastRow();\n  if (lastCol \u003c= 0) return false;\n\n  const headers = sheetPin.getRange(1, 1, 1, lastCol).getDisplayValues()[0].map(h =\u003e String(h || \u0027\u0027).trim());\n  const hasPre = headers.some(h =\u003e /^(batas_pre_test|batas_pretest|max_pre_test|max_pretest|limit_pre_test|kuota_pre_test)$/i.test(h));\n  const hasPost = headers.some(h =\u003e /^(batas_post_test|batas_posttest|max_post_test|max_posttest|limit_post_test|kuota_post_test)$/i.test(h));\n  if (hasPre \u0026\u0026 hasPost) return false;\n\n  const jmlIdx = headers.findIndex(h =\u003e /^(jml_soal|jumlah_soal)$/i.test(h));\n  if (!hasPre \u0026\u0026 !hasPost \u0026\u0026 jmlIdx !== -1) {\n    const insertAfterCol = jmlIdx + 1; // 1-based column of Jml_Soal\n    sheetPin.insertColumnsAfter(insertAfterCol, 2);\n    sheetPin.getRange(1, insertAfterCol + 1, 1, 2).setValues([[\u0027Batas_Pre_Test\u0027, \u0027Batas_Post_Test\u0027]]);\n    if (lastRow \u003e= 2) {\n      const defRows = [];\n      for (let r = 2; r \u003c= lastRow; r++) defRows.push([1, 2]);\n      sheetPin.getRange(2, insertAfterCol + 1, defRows.length, 2).setValues(defRows);\n    }\n    return true;\n  }\n\n  let curLastCol = sheetPin.getLastColumn();\n  if (!hasPre) {\n    curLastCol++;\n    sheetPin.getRange(1, curLastCol).setValue(\u0027Batas_Pre_Test\u0027);\n  }\n  if (!hasPost) {\n    curLastCol++;\n    sheetPin.getRange(1, curLastCol).setValue(\u0027Batas_Post_Test\u0027);\n  }\n  return true;\n}\n\nfunction getPinAttemptLimit(pinRow, jenisTes) {\n  if (!pinRow || typeof pinRow !== \u0027object\u0027) {\n    return /^pre(?:\\b|[\\s_-]*test)/i.test(String(jenisTes || \u0027\u0027).trim()) ? 1 : 2;\n  }\n  const isPre = /^pre(?:\\b|[\\s_-]*test)/i.test(String(jenisTes || \u0027\u0027).trim());\n  const rawVal = isPre\n    ? (pinRow.Batas_Pre_Test ?? pinRow.Batas_Pretest ?? pinRow.Max_Pre_Test ?? pinRow.Max_Pretest ?? pinRow.Limit_Pre_Test ?? pinRow.Kuota_Pre_Test ?? \u0027\u0027)\n    : (pinRow.Batas_Post_Test ?? pinRow.Batas_Posttest ?? pinRow.Max_Post_Test ?? pinRow.Max_Posttest ?? pinRow.Limit_Post_Test ?? pinRow.Kuota_Post_Test ?? \u0027\u0027);\n  const strVal = String(rawVal !== undefined \u0026\u0026 rawVal !== null ? rawVal : \u0027\u0027).trim();\n  if (!strVal) return isPre ? 1 : 2;\n  const parsed = parseInt(strVal, 10);\n  if (isNaN(parsed)) return isPre ? 1 : 2;\n  return parsed;\n}\n\nfunction checkPinAttemptQuota(ss, pinRow, idKaryawan, jenisTesInput, bypassCache, tzOffParam) {\n  if (!pinRow || !idKaryawan) return { allowed: true };\n  const isPre = /^pre(?:\\b|[\\s_-]*test)/i.test(String(jenisTesInput || \u0027\u0027).trim());\n  const labelTes = isPre ? \u0027Pre Test\u0027 : \u0027Post Test\u0027;\n  const maxLimit = getPinAttemptLimit(pinRow, labelTes);\n  if (maxLimit \u003c= 0) return { allowed: true, maxLimit: maxLimit, used: 0 };\n\n  const karMatch = findKaryawanInSheets(ss, idKaryawan, false);\n  const empIds = karMatch ? getEmployeeIds(karMatch) : [String(idKaryawan).trim().toLowerCase()];\n  if (empIds.indexOf(String(idKaryawan).trim().toLowerCase()) === -1) {\n    empIds.push(String(idKaryawan).trim().toLowerCase());\n  }\n\n  const targetPin = String(pinRow.Kode_PIN || \u0027\u0027).trim().toUpperCase();\n  const targetMod = String(pinRow.ID_Modul || \u0027\u0027).trim().toUpperCase();\n  const todayStr = Utilities.formatDate(new Date(), getSheetTz(ss, tzOffParam), \u0027yyyy-MM-dd\u0027);\n  const NO_DATE = \u00270000-00-00\u0027;\n  const targetDate = normalizeDate(pinRow.Tanggal, todayStr) || NO_DATE;\n\n  // Semua sesi Jadwal_PIN dengan Kode_PIN yang sama (PIN boleh dipakai ulang di tanggal/pelatihan lain)\n  const samePinRows = getSheetData(ss, SHEETS.PIN).filter(p =\u003e String(p.Kode_PIN || \u0027\u0027).trim().toUpperCase() === targetPin);\n  if (!samePinRows.some(p =\u003e (normalizeDate(p.Tanggal, todayStr) || NO_DATE) === targetDate)) samePinRows.push(pinRow);\n\n  // Percobaan \"dimiliki\" oleh sesi PIN+modul yang tanggalnya paling dekat sebelum/sama dengan tanggal pengerjaan\n  const ownerDate = function(h) {\n    const hMod = String(h.ID_Modul || \u0027\u0027).trim().toUpperCase();\n    const dates = samePinRows\n      .filter(p =\u003e !hMod || !p.ID_Modul || String(p.ID_Modul).trim().toUpperCase() === hMod)\n      .map(p =\u003e normalizeDate(p.Tanggal, todayStr) || NO_DATE)\n      .filter((v, i, a) =\u003e a.indexOf(v) === i)\n      .sort();\n    if (!dates.length) return null;\n    const rawD = String(h.Tanggal_Training || h.Tanggal || \u0027\u0027).trim().split(/\\s+/)[0];\n    const rawTs = String(h.Timestamp_Submit || \u0027\u0027).trim().split(/\\s+/)[0];\n    const hd = normalizeDate(rawD, todayStr) || normalizeDate(rawTs, todayStr);\n    if (!hd) return dates.length === 1 ? dates[0] : null;\n    let own = \u0027BEFORE\u0027;\n    dates.forEach(d =\u003e { if (d \u003c= hd) own = d; });\n    return own;\n  };\n\n  const hasilRows = getSheetData(ss, SHEETS.HASIL, Boolean(bypassCache));\n  const matchedAttempts = hasilRows.filter(function(h) {\n    if (!matchesEmployeeIds(h, empIds)) return false;\n    if (String(h.Status_Lulus || \u0027\u0027).trim().toUpperCase() === \u0027HANYA ABSEN\u0027) return false;\n    if (String(h.Kode_PIN || \u0027\u0027).trim().toUpperCase() !== targetPin) return false;\n    const hMod = String(h.ID_Modul || \u0027\u0027).trim().toUpperCase();\n    if (targetMod \u0026\u0026 hMod \u0026\u0026 hMod !== targetMod) return false;\n    const own = ownerDate(h);\n    if (own !== null \u0026\u0026 own !== targetDate) return false;\n    const hPre = /^pre(?:\\b|[\\s_-]*test)/i.test(String(h.Jenis_Tes || h.Tipe_Tes || \u0027\u0027).trim());\n    return isPre ? hPre : !hPre;\n  });\n\n  const usedCount = matchedAttempts.length;\n  if (usedCount \u003e= maxLimit) {\n    return {\n      allowed: false,\n      used: usedCount,\n      maxLimit: maxLimit,\n      message: \u0027Batas pengerjaan \u0027 + labelTes + \u0027 untuk Kode PIN \"\u0027 + targetPin + \u0027\" adalah maksimal \u0027 + maxLimit + \u0027 kali (Anda sudah mengerjakan \u0027 + usedCount + \u0027 kali).\u0027\n    };\n  }\n  return { allowed: true, used: usedCount, maxLimit: maxLimit };\n}\n\n/**\n * Helper membuat response JSON\n */\nfunction jsonResponse(payload) {\n  return ContentService\n    .createTextOutput(JSON.stringify(payload))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n\n/**\n * ============================================================================\n * 1. HANDLER GET REQUEST (Murni Membaca Data dari Sheet)\n * ============================================================================\n * Query Parameter (?action=...):\n * - action=init          : Ambil semua data Katalog_Modul, Jadwal_PIN aktif, \u0026 daftar Data_Karyawan dari Sheet\n * - action=verify_pin    : Cek Kode_PIN, Tanggal, Jam_Mulai \u0026 Jam_Selesai langsung ke Sheet Jadwal_PIN\n * - action=get_questions : Ambil soal dari Sheet Bank_Soal sesuai ID_Modul pada PIN yang valid\n * - action=get_profile   : Ambil data profil dari Data_Karyawan, Matriks_Kompetensi, \u0026 Hasil_Asesmen\n * - action=read_sheet    : Ambil isi mentah dari nama sheet apa pun (\u0026sheet=Nama_Sheet)\n */\nfunction doGet(e) {\n  try {\n    const params = (e \u0026\u0026 e.parameter) ? e.parameter : {};\n    const ss = getSS(params);\n    const action = params.action || \u0027init\u0027;\n\n    // Ambil isi sheet tertentu secara langsung jika diminta (?action=read_sheet\u0026sheet=...)\n    if (action === \u0027read_sheet\u0027) {\n      const sheetName = cleanInput(params.sheet || \u0027\u0027, 60);\n      if (!sheetName) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Parameter sheet wajib diisi.\u0027 });\n      }\n      const isOwnerSheet = OWNER_SHEETS.indexOf(sheetName) !== -1;\n      if (PUBLIC_SHEETS.indexOf(sheetName) === -1 \u0026\u0026 !isOwnerSheet) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Akses ke sheet tersebut tidak diizinkan.\u0027 });\n      }\n      let rows = (sheetName === SHEETS.TRAINER || sheetName === SHEETS.TRAINER_LEGACY)\n        ? getTrainerData(ss)\n        : getSheetData(ss, sheetName);\n      if (isOwnerSheet) {\n        const ownerKey = String(params.id_karyawan || params.nik_ktp || params.nik || \u0027\u0027).trim().toLowerCase();\n        if (ownerKey.length \u003c 3) {\n          return jsonResponse({ status: \u0027error\u0027, message: \u0027Parameter id_karyawan wajib diisi untuk sheet ini.\u0027 });\n        }\n        const matchedEmp = findKaryawanInSheets(ss, ownerKey, false);\n        const ownerIds = matchedEmp ? getEmployeeIds(matchedEmp) : [ownerKey];\n        if (ownerIds.indexOf(ownerKey) === -1) ownerIds.push(ownerKey);\n        rows = rows.filter(r =\u003e matchesEmployeeIds(r, ownerIds));\n      }\n      // Proteksi keamanan: Jangan pernah mengirimkan Kunci Jawaban ke browser\n      if (sheetName === SHEETS.SOAL) {\n        rows = rows.map(q =\u003e {\n          const copy = Object.assign({}, q);\n          delete copy.Kunci;\n          return copy;\n        });\n      } else if (sheetName === SHEETS.HASIL) {\n        rows = rows.map(h =\u003e {\n          const copy = Object.assign({}, h);\n          delete copy.Jawaban_Peserta_JSON;\n          return copy;\n        });\n      }\n      return jsonResponse({\n        status: \u0027success\u0027,\n        sheet: sheetName,\n        data: rows\n      });\n    }\n\n    // 1. INIT / BOOTSTRAP: Ambil Katalog Modul, Sesi Aktif/Terjadwal, List Trainer, Company, Departement, Jabatan, Jenis Simulator, dan Jadwal Import langsung dari Sheet\n    // (Data_Karyawan \u0026 New_Register tidak dibaca di sini karena response init mengosongkannya; pencarian dilakukan per-user di get_profile)\n    if (action === \u0027init\u0027 || action === \u0027bootstrap\u0027) {\n      const modulList = getSheetData(ss, SHEETS.MODUL);\n      const pinList = getSheetData(ss, SHEETS.PIN);\n      const trainerList = getTrainerData(ss);\n      const companyList = getSheetData(ss, SHEETS.COMPANY);\n      const departementList = getSheetData(ss, SHEETS.DEPARTEMENT);\n      const jabatanList = getSheetData(ss, SHEETS.JABATAN);\n      const jenisSimulatorList = getSheetData(ss, SHEETS.JENIS_SIMULATOR);\n      const jadwalImportList = getSheetData(ss, SHEETS.JADWAL_IMPORT);\n\n      const activeSessions = pinList.filter(p =\u003e {\n        const st = String(p.Status || \u0027\u0027).trim().toUpperCase();\n        return st !== \u0027NONAKTIF\u0027;\n      }).map(p =\u003e { const c = Object.assign({}, p); delete c.Kode_PIN; return c; });\n\n      return jsonResponse({\n        status: \u0027success\u0027,\n        data: {\n          modul: modulList,\n          sesi: activeSessions,\n          sesi_aktif: activeSessions,\n          karyawan: [],\n          new_register: [],\n          trainer: trainerList,\n          trainer_name: trainerList,\n          company: companyList,\n          departement: departementList,\n          jabatan: jabatanList,\n          position_title: jabatanList,\n          jenis_simulator: jenisSimulatorList,\n          jadwal_import: jadwalImportList\n        }\n      });\n    }\n\n    // 2. VERIFY PIN: Validasi PIN, Tanggal, Jam, \u0026 Modul langsung dari Sheet Jadwal_PIN\n    if (action === \u0027verify_pin\u0027) {\n      const inputPin = String(params.pin || \u0027\u0027).trim().toUpperCase();\n      const requestedModul = String(params.id_modul || \u0027\u0027).trim().toUpperCase();\n\n      if (!inputPin) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Kode PIN wajib diisi.\u0027 });\n      }\n\n      const validation = validatePinSession(ss, inputPin, requestedModul, params.tz_off, params.tanggal || \u0027\u0027);\n      if (!validation.valid) {\n        return jsonResponse({ status: \u0027error\u0027, message: validation.message });\n      }\n\n      return jsonResponse({\n        status: \u0027success\u0027,\n        message: \u0027Kode PIN valid.\u0027,\n        session: validation.session\n      });\n    }\n\n    // 3. GET QUESTIONS: Tarik soal langsung dari Sheet Bank_Soal berdasarkan PIN\n    if (action === \u0027get_questions\u0027) {\n      const inputPin = String(params.pin || \u0027\u0027).trim().toUpperCase();\n      const validation = validatePinSession(ss, inputPin, params.id_modul || \u0027\u0027, params.tz_off, params.tanggal || \u0027\u0027);\n\n      if (!validation.valid) {\n        return jsonResponse({ status: \u0027error\u0027, message: validation.message });\n      }\n\n      const session = validation.session;\n      if (params.id_karyawan \u0026\u0026 params.jenis_tes) {\n        const quotaRes = checkPinAttemptQuota(ss, session, params.id_karyawan, params.jenis_tes, false, params.tz_off);\n        if (!quotaRes.allowed) {\n          return jsonResponse({ status: \u0027error\u0027, message: quotaRes.message });\n        }\n      }\n      const allQuestions = getSheetData(ss, SHEETS.SOAL);\n\n      let moduleQuestions = allQuestions.filter(\n        q =\u003e matchesModuleAlias(q.ID_Modul, session.ID_Modul)\n      );\n\n      moduleQuestions.sort((a, b) =\u003e (parseInt(a.No_Urut, 10) || 0) - (parseInt(b.No_Urut, 10) || 0));\n\n      // Acak urutan soal jika kolom Acak_Soal di Sheet Jadwal_PIN bernilai \u0027YA\u0027\n      if (String(session.Acak_Soal || \u0027\u0027).trim().toUpperCase() === \u0027YA\u0027) {\n        moduleQuestions = shuffleArray(moduleQuestions);\n      }\n\n      // Ambil sejumlah Jml_Soal yang diset di Sheet Jadwal_PIN\n      const limitSoal = parseInt(session.Jml_Soal, 10);\n      if (!isNaN(limitSoal) \u0026\u0026 limitSoal \u003e 0) {\n        moduleQuestions = moduleQuestions.slice(0, limitSoal);\n      }\n\n      // Kirim data soal ke browser tanpa kolom Kunci Jawaban\n      const questionsForClient = moduleQuestions.map((q, idx) =\u003e {\n        const copy = Object.assign({}, q);\n        delete copy.Kunci;\n        copy.No_Tampil = idx + 1;\n        return copy;\n      });\n\n      return jsonResponse({\n        status: \u0027success\u0027,\n        session: session,\n        questions: questionsForClient\n      });\n    }\n\n    // 4. GET PROFILE / CHECK NFC: Ambil Profil Karyawan, Matriks Kompetensi, Histori Asesmen, dan Histori Simulator dari Sheet\n    if (action === \u0027get_profile\u0027 || action === \u0027check_nfc\u0027) {\n      const isNfcAction = action === \u0027check_nfc\u0027 || Boolean(params.nfc_uid);\n      const requestedKey = String(params.nfc_uid || params.id_karyawan || params.nik || params.username || \u0027\u0027).trim();\n      if (!requestedKey || requestedKey.length \u003c 2) {\n        return jsonResponse({\n          status: \u0027error\u0027,\n          message: isNfcAction ? \u0027Kode Kartu NFC tidak terdeteksi atau kosong.\u0027 : \u0027ID_Karyawan / NIK lengkap (minimal 3 karakter) wajib diisi untuk mengakses akun demi akurasi data.\u0027\n        });\n      }\n\n      const explicitBypass = params.bypass === \u00271\u0027;\n      const masterBypass = params.bypass_master === \u00271\u0027;\n      const altKeys = String(params.alt_keys || \u0027\u0027).split(\u0027,\u0027).map(s =\u003e s.trim()).filter(Boolean);\n      const searchKeys = [requestedKey].concat(altKeys);\n      const profil = findKaryawanInSheets(ss, searchKeys, explicitBypass || isNfcAction);\n\n      if (!profil) {\n        // Jika bukan dari scan NFC langsung, jalankan validasi format NIK lama\n        if (!isNfcAction) {\n          const hasLetter = /[a-z]/i.test(requestedKey);\n          const hasDigit = /[0-9]/.test(requestedKey);\n          const digitsOnly = requestedKey.replace(/\\D/g, \u0027\u0027);\n          const isLongNumeric = !hasLetter \u0026\u0026 hasDigit \u0026\u0026 digitsOnly.length \u003e= 10;\n          if (!isLongNumeric \u0026\u0026 (!hasLetter || !hasDigit)) {\n            return jsonResponse({\n              status: \u0027error\u0027,\n              message: \u0027ID Karyawan / NIK harus memuat kombinasi huruf dan angka (contoh: MCC-260156, PGP260062). Jika hanya angka tanpa huruf, minimal lebih dari 10 digit (seperti No HP atau No KTP).\u0027\n            });\n          }\n        }\n\n        return jsonResponse({\n          status: \u0027error\u0027,\n          not_found: true,\n          query: requestedKey,\n          message: \u0027Data karyawan dengan NIK / ID / NFC \"\u0027 + requestedKey + \u0027\" tidak ditemukan di Sheet \u0027 + SHEETS.KARYAWAN + \u0027 maupun \u0027 + SHEETS.NEW_REGISTER + \u0027.\u0027\n        });\n      }\n\n      const hasilList = getSheetData(ss, SHEETS.HASIL, explicitBypass);\n      const hasilSimulatorList = getSheetData(ss, SHEETS.HASIL_SIMULATOR, explicitBypass);\n\n      const empIds = getEmployeeIds(profil);\n      if (requestedKey \u0026\u0026 empIds.indexOf(requestedKey.toLowerCase()) === -1) {\n        empIds.push(requestedKey.toLowerCase());\n      }\n\n      const histori = hasilList\n        .filter(h =\u003e matchesEmployeeIds(h, empIds))\n        .map(h =\u003e {\n          const copy = Object.assign({}, h);\n          delete copy.Jawaban_Peserta_JSON;\n          return copy;\n        });\n      const matriks = buildEmployeeMatrix(ss, profil, empIds, histori, masterBypass);\n      const historiSimulator = hasilSimulatorList.filter(s =\u003e matchesEmployeeIds(s, empIds));\n\n      let trainerList = getTrainerData(ss, explicitBypass);\n      let matchedTrainer = matchTrainerAccount(trainerList, profil.Nama_Lengkap || profil.Nama_Karyawan, empIds);\n      if (!matchedTrainer \u0026\u0026 !explicitBypass) {\n        trainerList = getTrainerData(ss, true);\n        matchedTrainer = matchTrainerAccount(trainerList, profil.Nama_Lengkap || profil.Nama_Karyawan, empIds);\n      }\n      let trainerPins = [];\n      let allHasilForTrainer = [];\n      if (matchedTrainer) {\n        trainerPins = getSheetData(ss, SHEETS.PIN, explicitBypass).filter(p =\u003e {\n          const st = String(p.Status || \u0027\u0027).trim().toUpperCase();\n          return st !== \u0027NONAKTIF\u0027;\n        });\n        allHasilForTrainer = hasilList.map(h =\u003e {\n          const copy = Object.assign({}, h);\n          delete copy.Jawaban_Peserta_JSON;\n          return copy;\n        });\n      }\n\n      return jsonResponse({\n        status: \u0027success\u0027,\n        data: {\n          profil: profil,\n          matriks: matriks,\n          histori: histori,\n          hasil_simulator: historiSimulator,\n          is_trainer: Boolean(matchedTrainer),\n          trainer_info: matchedTrainer || null,\n          trainer_pins: trainerPins,\n          all_hasil: allHasilForTrainer\n        }\n      });\n    }\n\n    // 5. TRAINER DASHBOARD: Ambil Kode Akses (PIN) Aktif \u0026 Seluruh Nilai Peserta untuk Trainer terdaftar di Trainer_Name\n    if (action === \u0027trainer_dashboard\u0027) {\n      const reqId = cleanInput(params.id_karyawan || params.nik || \u0027\u0027, 60);\n      const reqName = cleanInput(params.nama_karyawan || params.name || \u0027\u0027, 120);\n      const reqBypass = params.bypass === \u00271\u0027;\n      const trainerList = getTrainerData(ss, reqBypass);\n      let matchedTrainer = matchTrainerAccount(trainerList, reqName, reqId);\n      if (!matchedTrainer \u0026\u0026 reqId) {\n        const prof = findKaryawanInSheets(ss, reqId, false);\n        if (prof) {\n          matchedTrainer = matchTrainerAccount(trainerList, prof.Nama_Lengkap || prof.Nama_Karyawan, getEmployeeIds(prof));\n        }\n      }\n      if (!matchedTrainer) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Akun tidak terdaftar sebagai Trainer di Sheet Trainer_Name.\u0027 });\n      }\n      const pinList = getSheetData(ss, SHEETS.PIN, reqBypass).filter(p =\u003e {\n        const st = String(p.Status || \u0027\u0027).trim().toUpperCase();\n        return st !== \u0027NONAKTIF\u0027;\n      });\n      const allHasil = getSheetData(ss, SHEETS.HASIL, reqBypass).map(h =\u003e {\n        const copy = Object.assign({}, h);\n        delete copy.Jawaban_Peserta_JSON;\n        return copy;\n      });\n      return jsonResponse({\n        status: \u0027success\u0027,\n        data: {\n          is_trainer: true,\n          trainer_info: matchedTrainer,\n          trainer_pins: pinList,\n          all_hasil: allHasil\n        }\n      });\n    }\n\n    // 6. ADMIN READ / ADMIN INIT: Membaca data lengkap Sheet untuk Panel Admin L\u0026D (termasuk Kunci Bank_Soal \u0026 Kode_PIN)\n    if (action === \u0027admin_read\u0027) {\n      const targetSheet = cleanInput(params.sheet || \u0027\u0027, 80);\n      const bypass = params.bypass === \u00271\u0027;\n      if (!targetSheet || READABLE_SHEETS.indexOf(targetSheet) === -1) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Sheet tidak valid atau tidak terdaftar: \u0027 + targetSheet });\n      }\n      const rows = getSheetData(ss, targetSheet, bypass);\n      return jsonResponse({\n        status: \u0027success\u0027,\n        sheet: targetSheet,\n        count: rows.length,\n        data: rows\n      });\n    }\n\n    if (action === \u0027admin_init\u0027) {\n      const bypass = params.bypass === \u00271\u0027;\n      try {\n        if (ensureJadwalPinLimitHeaders(ss.getSheetByName(SHEETS.PIN))) {\n          invalidateSheetCache(SHEETS.PIN);\n        }\n      } catch (e) {}\n      return jsonResponse({\n        status: \u0027success\u0027,\n        data: {\n          katalog_modul: getSheetData(ss, SHEETS.MODUL, bypass),\n          jadwal_pin: getSheetData(ss, SHEETS.PIN, bypass),\n          bank_soal: getSheetData(ss, SHEETS.SOAL, bypass),\n          trainer: getTrainerData(ss, bypass),\n          jadwal_import: getSheetData(ss, SHEETS.JADWAL_IMPORT, bypass),\n          company: getSingleColList(ss, SHEETS.COMPANY, [\u0027Company\u0027, \u0027Nama_Company\u0027, \u0027company\u0027], \u0027Company\u0027),\n          departement: getSingleColList(ss, SHEETS.DEPARTEMENT, [\u0027Departement\u0027, \u0027Departemen\u0027, \u0027Department\u0027], \u0027Departement\u0027),\n          jabatan: getPositionListFromSheet(ss),\n          jenis_simulator: getJenisSimulatorList(ss)\n        }\n      });\n    }\n\n    return jsonResponse({ status: \u0027error\u0027, message: \u0027Action tidak dikenali: \u0027 + action });\n  } catch (err) {\n    return jsonResponse({ status: \u0027error\u0027, message: err.toString() });\n  }\n}\n\n/**\n * ============================================================================\n * 2. HANDLER POST REQUEST (Murni Koreksi dari Sheet Bank_Soal \u0026 Simpan ke Sheet Hasil_Asesmen)\n * ============================================================================\n */\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(25000);\n    const rawBody = (e \u0026\u0026 e.postData \u0026\u0026 e.postData.contents) ? e.postData.contents : \u0027{}\u0027;\n    const body = JSON.parse(rawBody);\n    const ss = getSS(body);\n    const action = cleanInput(body.action || \u0027submit_exam\u0027, 40);\n\n    if (action === \u0027register_karyawan\u0027 || action === \u0027new_register\u0027) {\n      const idKaryawan = cleanInput(body.ID_Karyawan || body.NIK || body.id_karyawan || body.nik_KTP || body.NIK_KTP || \u0027\u0027, 60).toUpperCase();\n      const namaLengkap = cleanInput(body.Nama_Lengkap || body.nama_karyawan || \u0027\u0027, 120);\n      const company = cleanInput(body.Company || body.Nama_Company || body.company || body.nama_company || \u0027\u0027, 120);\n      const departemen = cleanInput(getEmpDept(body) || \u0027Umum\u0027, 100);\n      const jabatan = cleanInput(getEmpPosition(body) || \u0027Staff / Peserta\u0027, 100);\n      const statusLevel = cleanInput(getEmpLevel(body) || \u0027New Register\u0027, 50);\n      if (!idKaryawan || idKaryawan.length \u003c 3 || !namaLengkap || namaLengkap.length \u003c 3 || !company) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027ID Karyawan lengkap (minimal 3 karakter), Nama Lengkap, dan Company wajib diisi demi akurasi data.\u0027 });\n      }\n      const hasLetter = /[A-Z]/i.test(idKaryawan);\n      const hasDigit = /[0-9]/.test(idKaryawan);\n      const digitsOnly = idKaryawan.replace(/\\D/g, \u0027\u0027);\n      const isLongNumeric = !hasLetter \u0026\u0026 hasDigit \u0026\u0026 digitsOnly.length \u003e= 10;\n      if (!isLongNumeric \u0026\u0026 (!hasLetter || !hasDigit)) {\n        return jsonResponse({\n          status: \u0027error\u0027,\n          message: \u0027ID Karyawan / NIK harus memuat kombinasi huruf dan angka (contoh: MCC-260156, PGP260062). Jika hanya angka tanpa huruf, minimal lebih dari 10 digit (seperti No HP atau No KTP).\u0027\n        });\n      }\n      if (!checkRateLimit(\u0027REG_\u0027 + idKaryawan, 4)) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Permintaan terlalu cepat. Silakan tunggu beberapa detik.\u0027 });\n      }\n      const now = new Date();\n      const timestampReg = Utilities.formatDate(now, \u0027Asia/Jakarta\u0027, \u0027yyyy-MM-dd HH:mm:ss\u0027);\n      const regProfil = {\n        Timestamp_Register: timestampReg,\n        ID_Karyawan: idKaryawan,\n        NIK: idKaryawan,\n        Nama_Lengkap: namaLengkap,\n        Company: company,\n        Nama_Company: company,\n        Departemen: departemen,\n        Department: departemen,\n        Departement: departemen,\n        Jabatan: jabatan,\n        Position_Title: jabatan,\n        Position_Tittle: jabatan,\n        Level: statusLevel,\n        Status_Level: statusLevel\n      };\n      saveToNewRegister(ss, regProfil);\n      invalidateSheetCache(SHEETS.NEW_REGISTER);\n      SpreadsheetApp.flush();\n      return jsonResponse({\n        status: \u0027success\u0027,\n        sheet: SHEETS.NEW_REGISTER,\n        message: \u0027Data peserta baru berhasil disimpan ke Sheet \u0027 + SHEETS.NEW_REGISTER + \u0027.\u0027,\n        profil: regProfil\n      });\n    }\n\n    if (action === \u0027submit_simulator\u0027) {\n      const idKaryawan = cleanInput(body.ID_Karyawan || body.id_karyawan || body.NIK || body.nik_KTP || body.NIK_KTP || body.No_KTP || \u0027\u0027, 60);\n      const namaKaryawan = cleanInput(body.Nama_Karyawan || body.nama_karyawan || body.Nama_Lengkap || \u0027\u0027, 120);\n      const jenisSimulator = cleanInput(body.Jenis_Simulator || body.jenis_simulator || body.Nama_Simulator || \u0027\u0027, 100);\n      const materiSimulator = cleanInput(body.Materi_Simulator || body.materi_simulator || body.Materi || body.materi || \u0027\u0027, 120);\n      const waktuSimulator = cleanInput(body.Waktu_Simulator || body.waktu_simulator || body.Durasi_Menit || body.durasi_menit || body.Waktu || body.waktu || \u0027\u0027, 60);\n      const clientTs = cleanInput(body.Timestamp_Submit || body.timestamp_submit || \u0027\u0027, 30);\n\n      if (!idKaryawan || idKaryawan.length \u003c 3 || !namaKaryawan || !jenisSimulator) {\n        return jsonResponse({\n          status: \u0027error\u0027,\n          message: \u0027ID_Karyawan lengkap (minimal 3 karakter), Nama_Karyawan, dan Jenis_Simulator wajib diisi demi akurasi data.\u0027\n        });\n      }\n\n      const now = new Date();\n      const timestampSubmit = /^\\d{4}-\\d{2}-\\d{2}\\s\\d{2}:\\d{2}:\\d{2}$/.test(clientTs)\n        ? clientTs\n        : Utilities.formatDate(now, \u0027Asia/Jakarta\u0027, \u0027yyyy-MM-dd HH:mm:ss\u0027);\n\n      let sheetSim = ss.getSheetByName(SHEETS.HASIL_SIMULATOR);\n      const defaultHeaders = [\u0027Timestamp_Submit\u0027, \u0027ID_Karyawan\u0027, \u0027Nama_Karyawan\u0027, \u0027Jenis_Simulator\u0027, \u0027Materi_Simulator\u0027, \u0027Waktu_Simulator\u0027];\n\n      if (!sheetSim) {\n        sheetSim = ss.insertSheet(SHEETS.HASIL_SIMULATOR);\n        sheetSim.appendRow(defaultHeaders);\n      } else if (sheetSim.getLastColumn() === 0) {\n        sheetSim.appendRow(defaultHeaders);\n      } else {\n        // Auto-check jika kolom Materi_Simulator atau Waktu_Simulator belum ada di baris 1\n        const existingHeaders = sheetSim.getRange(1, 1, 1, sheetSim.getLastColumn()).getValues()[0].map(h =\u003e String(h || \u0027\u0027).trim());\n        let lastCol = sheetSim.getLastColumn();\n        if (!existingHeaders.some(h =\u003e /^(materi_simulator|materi)$/i.test(h))) {\n          lastCol++;\n          sheetSim.getRange(1, lastCol).setValue(\u0027Materi_Simulator\u0027);\n        }\n        if (!existingHeaders.some(h =\u003e /^(waktu_simulator|waktu|durasi_menit|durasi)$/i.test(h))) {\n          lastCol++;\n          sheetSim.getRange(1, lastCol).setValue(\u0027Waktu_Simulator\u0027);\n        }\n      }\n\n      // Cek Idempotency agar retry jaringan tidak membuat duplikasi baris absensi\n      const existingSim = getSheetData(ss, SHEETS.HASIL_SIMULATOR, true).find(\n        r =\u003e String(r.Timestamp_Submit || \u0027\u0027).trim() === timestampSubmit \u0026\u0026\n             String(r.ID_Karyawan || \u0027\u0027).trim().toUpperCase() === idKaryawan.toUpperCase() \u0026\u0026\n             String(r.Jenis_Simulator || r.Nama_Simulator || \u0027\u0027).trim().toUpperCase() === jenisSimulator.toUpperCase()\n      );\n      if (existingSim) {\n        return jsonResponse({\n          status: \u0027success\u0027,\n          sheet: SHEETS.HASIL_SIMULATOR,\n          message: \u0027Absensi penggunaan simulator sudah tercatat sebelumnya (idempotent).\u0027,\n          result: existingSim\n        });\n      }\n\n      if (!checkRateLimit(\u0027SIM_\u0027 + idKaryawan + \u0027_\u0027 + jenisSimulator, 3)) {\n        return jsonResponse({\n          status: \u0027error\u0027,\n          message: \u0027Pengiriman terlalu cepat. Tunggu beberapa detik sebelum menyimpan lagi.\u0027\n        });\n      }\n\n      const rowSim = {\n        Timestamp_Submit: timestampSubmit,\n        ID_Karyawan: idKaryawan,\n        Nama_Karyawan: namaKaryawan,\n        Jenis_Simulator: jenisSimulator,\n        Nama_Simulator: jenisSimulator,\n        Materi_Simulator: materiSimulator,\n        Materi: materiSimulator,\n        materi_simulator: materiSimulator,\n        Waktu_Simulator: waktuSimulator,\n        Durasi_Menit: waktuSimulator,\n        Waktu: waktuSimulator,\n        waktu_simulator: waktuSimulator\n      };\n\n      appendRowByHeader(sheetSim, rowSim);\n      invalidateSheetCache(SHEETS.HASIL_SIMULATOR);\n      SpreadsheetApp.flush();\n\n      return jsonResponse({\n        status: \u0027success\u0027,\n        sheet: SHEETS.HASIL_SIMULATOR,\n        message: \u0027Absensi penggunaan simulator berhasil disimpan ke Sheet \u0027 + SHEETS.HASIL_SIMULATOR + \u0027.\u0027,\n        result: {\n          Timestamp_Submit: timestampSubmit,\n          ID_Karyawan: idKaryawan,\n          Nama_Karyawan: namaKaryawan,\n          Jenis_Simulator: jenisSimulator,\n          Materi_Simulator: materiSimulator,\n          Waktu_Simulator: waktuSimulator\n        }\n      });\n    }\n\n    if (action === \u0027submit_exam\u0027) {\n      const kodePin = cleanInput(body.kode_pin || \u0027\u0027, 30).toUpperCase();\n      const idKaryawan = cleanInput(body.id_karyawan || body.ID_Karyawan || body.NIK || body.nik_KTP || body.NIK_KTP || body.No_KTP || \u0027\u0027, 60);\n      const namaKaryawan = cleanInput(body.nama_karyawan || \u0027\u0027, 120);\n      const company = cleanInput(getEmpCompany(body), 120);\n      const departemen = cleanInput(getEmpDept(body), 100);\n      const jabatan = cleanInput(getEmpPosition(body), 100);\n      const empLvlVal = cleanInput(getEmpLevel(body), 50);\n      const idModul = cleanInput(body.id_modul || \u0027\u0027, 60);\n      const namaTrainer = cleanInput(body.nama_trainer || body.Nama_Trainer || body.trainer_name || body.Name || \u0027\u0027, 120);\n      let specialistTrainer = cleanInput(body.specialist_trainer || body.Specialist_Trainer || body.specialist || body.Specialist || \u0027\u0027, 120);\n      if (!specialistTrainer \u0026\u0026 namaTrainer) {\n        const foundTr = getTrainerData(ss).find(t =\u003e String(t.Name || \u0027\u0027).toUpperCase() === namaTrainer.toUpperCase());\n        if (foundTr \u0026\u0026 foundTr.Specialist) specialistTrainer = foundTr.Specialist;\n      }\n      const jamMulaiTraining = cleanInput(body.jam_mulai_training || \u0027\u0027, 20);\n      const jamBerakhirTraining = cleanInput(body.jam_berakhir_training || \u0027\u0027, 20);\n      const jenisTesInput = cleanInput(body.jenis_tes || body.Jenis_Tes || body.tipe_tes || body.Tipe_Tes || \u0027\u0027, 40);\n      const sisaWaktu = cleanInput(body.sisa_waktu || \u0027\u0027, 20);\n      const clientIdUjian = cleanInput(body.id_ujian || \u0027\u0027, 40);\n      const rawJawaban = (body.jawaban \u0026\u0026 typeof body.jawaban === \u0027object\u0027) ? body.jawaban : {};\n\n      if (!idKaryawan || idKaryawan.length \u003c 3 || !namaKaryawan || !idModul || !kodePin) {\n        return jsonResponse({\n          status: \u0027error\u0027,\n          message: \u0027Data peserta (ID Karyawan lengkap minimal 3 karakter), Kode PIN, dan ID Modul wajib diisi lengkap demi akurasi data.\u0027\n        });\n      }\n\n      const sheetHasil = ss.getSheetByName(SHEETS.HASIL);\n      if (!sheetHasil) {\n        return jsonResponse({ status: \u0027error\u0027, message: \u0027Sheet \u0027 + SHEETS.HASIL + \u0027 tidak ditemukan.\u0027 });\n      }\n\n      // Cek Idempotency: jika ID_Ujian yang sama sudah pernah tersimpan (mis. karena retry jaringan), langsung kembalikan hasilnya tanpa duplikasi baris\n      if (clientIdUjian) {\n        const existingHasil = getSheetData(ss, SHEETS.HASIL, true).find(\n          h =\u003e String(h.ID_Ujian || \u0027\u0027).trim() === clientIdUjian \u0026\u0026\n             String(h.ID_Karyawan || \u0027\u0027).trim().toUpperCase() === idKaryawan.toUpperCase()\n        );\n        if (existingHasil) {\n          const isPreIdemp = /^pre(?:\\b|[\\s_-]*test)/i.test(String(existingHasil.Jenis_Tes || jenisTesInput || \u0027\u0027).trim());\n          if (!isPreIdemp \u0026\u0026 body.feedback \u0026\u0026 typeof body.feedback === \u0027object\u0027) {\n            saveTrainingFeedback(ss, {\n              Timestamp_Submit: existingHasil.Timestamp_Submit || Utilities.formatDate(new Date(), \u0027Asia/Jakarta\u0027, \u0027yyyy-MM-dd HH:mm:ss\u0027),\n              ID_Ujian: clientIdUjian,\n              Kode_PIN: kodePin,\n              ID_Karyawan: idKaryawan,\n              Nama_Karyawan: namaKaryawan,\n              Company: company,\n              Departemen: departemen,\n              Jabatan: jabatan,\n              Position_Title: jabatan,\n              Position_Tittle: jabatan,\n              Level: empLvlVal,\n              Status_Level: empLvlVal,\n              ID_Modul: idModul,\n              Nama_Modul: existingHasil.Nama_Modul_Sertifikat || idModul,\n              Nama_Trainer: namaTrainer,");
  document.getElementById('res').innerText = 'OK';
} catch(e) {
  document.getElementById('res').innerText = e.message;
}
