<style>
:root{--bg:#f6f3ec;--sf:#ffffff;--sf2:#efeae0;--ink:#23160a;--mut:#6b5b49;--ln:#dfd6c5;--p:#92701d;--p2:#785b15;--gold:#bd9a56;--leaf:#d6ad60;--br:#523214;--pt:#ffffff;--pf:#f6edd8;--ok:#186a3b;--okb:#e3f3ea;--er:#a62319;--erb:#fbe7e5;--wa:#8a5000;--wab:#fdf0d5;--sh:0 1px 3px rgba(82,50,20,.06)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
.mi{font-family:'Material Symbols Outlined';font-weight:500;font-size:19px;line-height:1;font-style:normal;display:inline-block;vertical-align:middle;white-space:nowrap;letter-spacing:normal;text-transform:none;font-feature-settings:'liga';visibility:hidden}
.fr .mi{visibility:visible}
.ic-ex{width:19px;height:19px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:2px solid var(--gold)}
.logo-img{height:30px;width:auto;max-width:155px;object-fit:contain;display:block;flex:none}
.h-div{width:1px;height:24px;background:var(--ln);flex:none}
.login-brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--ln)}
.login-logo{height:44px;width:auto;max-width:230px;object-fit:contain;display:block}
.cert-logo{height:38px;width:auto;max-width:200px;object-fit:contain;display:block;margin:0 auto 10px}
.brand{flex:1;min-width:0;line-height:1.25}.brand b{font-size:13px;font-weight:700;color:var(--br);display:block}.brand small{font-size:11px;color:var(--mut)}
.pill{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;background:var(--sf2);border:1px solid var(--ln);font-size:12px;font-weight:600;max-width:160px}
.pill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wa);flex:none}.dot.ok{background:var(--ok)}.dot.er{background:var(--er)}
main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom));max-width:860px;width:100%;margin:0 auto}
.view{display:none;flex-direction:column;gap:12px}.view.on{display:flex}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#fffdfa 0%,#f7efe0 60%,#f1e2c5 100%);color:var(--ink);border:1px solid #d8c398;border-top:3px solid var(--p);box-shadow:0 4px 14px rgba(146,112,29,.1)}
.hero h1{color:var(--br);font-size:18.5px;font-weight:800}
.hero .mut{color:#6d5841;font-weight:500}
.hero-co{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--p);letter-spacing:.02em;margin-bottom:2px}
h1{font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.01em}h2{font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.card h2{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.mut{color:var(--mut);font-size:13px}.sm{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{flex:1;min-width:0}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:42px;padding:0 16px;border-radius:6px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sf);border:1px solid var(--ln);transition:background .15s,border-color .15s}
.btn:hover{background:var(--sf2)}.btn:active{opacity:.88}.btn:disabled{opacity:.45;pointer-events:none}
.btn.p{background:var(--p);color:var(--pt);border-color:var(--p)}.btn.p:hover{background:var(--p2);border-color:var(--p2)}
.btn.s{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:5px}.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;background:var(--pf);color:var(--p);letter-spacing:.01em}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.er{background:var(--erb);color:var(--er)}.chip.wa{background:var(--wab);color:var(--wa)}.chip.gy{background:rgba(120,116,108,.16);color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--sf2);border:1px solid var(--ln);border-radius:6px;padding:10px 8px;text-align:left}
.hero .kpi{background:rgba(255,255,255,.88);border:1px solid #decb9f;box-shadow:0 1px 3px rgba(82,50,20,.05)}.kpi b{display:block;font-size:17.5px;font-weight:800;color:var(--br);font-variant-numeric:tabular-nums}.kpi small{font-size:11px;font-weight:600;color:var(--mut)}.hero .kpi small{color:#755f46}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--sf);border:1px solid var(--ln)}
.item.dim{background:rgba(128,124,116,.12);border-color:rgba(128,124,116,.25);opacity:.62}
.item.act{border-color:var(--p)}
.ava{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,var(--p) 0%,var(--gold) 100%);border:1px solid #7c5d14;color:#ffffff;box-shadow:0 2px 6px rgba(146,112,29,.22);display:grid;place-items:center;flex:none;overflow:hidden}
.inp{width:100%;height:42px;border-radius:6px;border:1px solid var(--ln);background:var(--sf);padding:0 12px;font-size:14.5px;outline:0}.inp:focus{border-color:var(--p)}
.sdd{position:relative;width:100%}.sdd .inp{padding-right:38px}
.sdd-b{position:absolute;right:4px;top:4px;width:34px;height:34px;border-radius:4px;display:grid;place-items:center;color:var(--mut)}.sdd-b:hover{background:var(--sf2);color:var(--ink)}
.sdd-m{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sf);border:1px solid var(--ln);border-radius:6px;box-shadow:0 6px 18px rgba(24,22,18,.14);max-height:210px;overflow-y:auto;z-index:40;display:none;padding:4px}
.sdd.open .sdd-m{display:block}
.sdd-i{width:100%;text-align:left;padding:8px 10px;border-radius:4px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.sdd-i:hover,.sdd-i.on{background:var(--pf);color:var(--p);font-weight:600}
.sdd-i small{color:var(--mut);font-size:11.5px;min-width:20px}
.sdd-e{padding:10px;font-size:12.5px;color:var(--mut);text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs button{flex:none;padding:6px 12px;border-radius:5px;font-size:12.5px;font-weight:600;background:var(--sf);border:1px solid var(--ln);color:var(--mut)}.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{background:var(--erb);color:var(--er);border:1px solid var(--er);padding:9px 12px;border-radius:6px;font-size:12.5px;font-weight:600;display:none}.err.on{display:block}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);z-index:20}
nav{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 8px env(safe-area-inset-bottom)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;border-top:2px solid transparent;border-radius:0 0 5px 5px;font-size:11px;font-weight:600;color:var(--mut);position:relative;transition:color .15s,background .15s}
nav button:hover{color:var(--ink);background:var(--sf2)}
nav .on{color:var(--p);background:var(--pf);border-top-color:var(--p);font-weight:700}
nav .nb{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:15px;padding:0 4px;border-radius:4px;background:var(--sf2);border:1px solid var(--ln);color:var(--ink);font-size:10px;font-weight:700;line-height:13px;text-align:center}
nav .nb.wa{background:var(--wab);border-color:var(--wa);color:var(--wa)}
nav .nb.er{background:var(--er);border-color:var(--er);color:#fff}
body.nonav footer,body.nonav header{display:none}body.nonav main{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.xbar{position:sticky;top:-16px;z-index:5;margin:-16px -16px 0;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{height:4px;border-radius:2px;background:var(--sf2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--p);transition:width .25s}
.tm{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:5px;background:var(--sf2);border:1px solid var(--ln);display:flex;gap:5px;align-items:center}.tm.wa{background:var(--wab);color:var(--wa);border-color:var(--wa)}.tm.er{background:var(--erb);color:var(--er);border-color:var(--er);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.55}}
.q{font-size:16.5px;font-weight:600;line-height:1.55}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:6px;border:1px solid var(--ln);background:var(--sf);font-size:14.5px;line-height:1.45}
.opt b{width:26px;height:26px;border-radius:4px;background:var(--sf2);border:1px solid var(--ln);display:grid;place-items:center;flex:none;font-size:12.5px;margin-top:1px}
.opt.on{border-color:var(--p);background:var(--pf)}.opt.on b{background:var(--p);color:var(--pt);border-color:var(--p)}
.dock{position:sticky;bottom:-16px;margin:0 -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--ln);display:flex;gap:8px;z-index:5}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.map button{height:40px;border-radius:5px;background:var(--sf2);border:1px solid var(--ln);font-weight:600;font-size:13px}.map .a{background:var(--p);color:var(--pt);border-color:var(--p)}.map .f{background:var(--wab);color:var(--wa);border-color:var(--wa)}.map .c{outline:2px solid var(--ink);outline-offset:1px}
.ov{position:fixed;inset:0;background:rgba(15,14,12,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:var(--sf);border:1px solid var(--ln);width:100%;max-width:480px;border-radius:10px 10px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow-y:auto}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:8px}.opt:hover{border-color:var(--p2)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:12.5px;font-weight:600;z-index:99;display:none;max-width:90vw}
.cert{border:2px solid var(--p);text-align:center}
ul.rules{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--mut)}
ul.rules b{color:var(--ink)}
@media(max-width:600px){
  body{font-size:13px}
  .mi{font-size:17px}.ic-ex{width:17px;height:17px}
  header{padding:8px 12px;gap:8px}
  .logo-img{height:24px;max-width:118px}
  .h-div{height:20px}
  .brand b{font-size:11.5px}.brand small{font-size:9.5px}
  .pill{padding:4px 8px;font-size:11px;max-width:112px;gap:5px}
  main{padding:11px 11px calc(68px + env(safe-area-inset-bottom))}
  .view{gap:9px}
  .card{padding:12px;border-radius:7px}
  .login-logo{height:34px;max-width:185px}
  .login-brand{padding-bottom:10px;margin-bottom:10px;gap:6px}
  h1,.hero h1{font-size:15px}
  h2{font-size:11.5px}
  .card h2{font-size:13.5px}
  .hero-co{font-size:10.5px}
  .mut{font-size:11.5px}.sm{font-size:11px}.lbl{font-size:11px;margin-bottom:3px}
  .ava{width:38px;height:38px;border-radius:6px}
  .kpis{gap:6px}
  .kpi{padding:7px 6px;border-radius:5px}
  .kpi b,.hero .kpi b{font-size:14px}
  .kpi small,.hero .kpi small{font-size:9.5px}
  .item{padding:10px 11px;gap:9px;border-radius:7px}
  .item b{font-size:12.5px!important}
  .chip{font-size:10px;padding:2px 6px}
  .btn{min-height:38px;padding:0 12px;font-size:12.5px}
  .btn.s{min-height:28px;padding:0 9px;font-size:11px}
  .inp{height:38px;padding:0 10px;font-size:13px}
  .sdd .inp{padding-right:34px}
  .sdd-b{width:30px;height:30px;top:4px;right:4px}
  .sdd-i{padding:7px 9px;font-size:12.5px}
  .tabs button{padding:5px 10px;font-size:11.5px}
  nav{gap:2px;padding:0 4px env(safe-area-inset-bottom)}
  nav button{padding:6px 2px 5px;font-size:10px;gap:2px}
  nav .nb{font-size:9px;height:14px;min-width:14px;line-height:12px;top:3px;right:calc(50% - 20px)}
  .xbar{margin:-11px -11px 0;padding:8px 12px}
  .tm{font-size:11.5px;padding:3px 8px}
  .q{font-size:14px;line-height:1.48}
  .opt{min-height:44px;padding:9px 11px;font-size:12.5px;gap:9px}
  .opt b{width:22px;height:22px;font-size:11px}
  .dock{margin:0 -11px -11px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .map{grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
  .map button{height:34px;font-size:12px}

async function req(u,opt={},ret=3){
  for(let i=0;i<ret;i++){
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
    try{
      const r=await fetch(u,{...opt,signal:ac.signal});clearTimeout(tm);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(er){
      clearTimeout(tm);
      if(i===ret-1)throw er;
      await new Promise(res=>setTimeout(res,700+i*1100+Math.floor(Math.random()*400)));
    }
  }
}

async function flushPending(){
  try{
    const pendReg=JSON.parse(localStorage.getItem('mgr_pending_reg')||'null');
    if(pendReg){const r=await po(pendReg,2);if(r&&r.status==='success')localStorage.removeItem('mgr_pending_reg')}
    const pendSim=JSON.parse(localStorage.getItem('mgr_pending_sim')||'[]');
    if(Array.isArray(pendSim)&&pendSim.length){
      const rem=[];
      for(const item of pendSim){
        try{const rs=await po(item,2);if(!rs||rs.status!=='success')rem.push(item)}catch{rem.push(item)}
      }
      if(rem.length)localStorage.setItem('mgr_pending_sim',JSON.stringify(rem));
      else localStorage.removeItem('mgr_pending_sim');
    }
    const pendSub=JSON.parse(localStorage.getItem('mgr_pending_sub')||'null');
    if(pendSub){
      const j=await po(pendSub,2);
      if(j&&j.status==='success'){
        localStorage.removeItem('mgr_pending_sub');
        toast('Jawaban ujian yang tertunda berhasil dikirim ke server.');
        refresh();
      }
    }
  }catch{}
}

function mergeSimHis(id,serverRows=[]){

  const all=[...(serverRows||[]).filter(r=>up(r.ID_Karyawan||r.NIK)===up(id)),...mineLoc];

  return all.filter(r=>{const k=up(`${r.Timestamp_Submit}|${r.ID_Karyawan}|${empSim(r)}`);return k&&!seen.has(k)&&seen.add(k)});
}

/* ---------- derived data ---------- */
function pd(){
  const lulus=S.his.filter(h=>up(h.Status_Lulus)==='LULUS');
  let m=S.mat.length?S.mat.map(x=>({...x})):S.modul.map((d,i)=>({ID_Modul:d.ID_Modul,Kode_Kompetensi:'KOMP-'+(i+1),Nama_Kompetensi:d.Nama_Modul||d.ID_Modul,Status:'NOT YET'}));
  m.forEach(x=>{const h=lulus.find(h=>up(h.ID_Modul)===up(x.ID_Modul));if(h&&up(x.Status)!=='DONE'){x.Status='DONE';x.Skor=h.Skor_Akhir;x.Tgl_Selesai=String(h.Timestamp_Submit).split(' ')[0];x.cert=h.No_Sertifikat}});
  const done=m.filter(x=>up(x.Status)==='DONE'),sc=S.his.map(h=>parseFloat(h.Skor_Akhir)).filter(n=>!isNaN(n));
  return{m,done,pct:m.length?Math.round(done.length/m.length*100):0,avg:sc.length?(sc.reduce((a,b)=>a+b)/sc.length).toFixed(1):'0',cert:lulus.length};
}
const isDone=(id)=>pd().done.some(x=>up(x.ID_Modul)===up(id));
const hasToday=(id)=>S.sesi.some(s=>up(s.ID_Modul)===up(id)&&dayDiff(s.Tanggal)===0&&!['NONAKTIF','SELESAI'].includes(up(s.Status)));
const left=()=>S.ex?Math.max(0,Math.round((S.ex.end-Date.now())/1000)):0;
const kp=(a,b,c,d)=>`<div class="kpis">${[a,b,c,d].map(([v,l])=>`<div class="kpi"><b>${e(v)}</b><small>${l}</small></div>`).join('')}</div>`;
function dayDiff(s){
  if(!s)return null;
  const m=String(s).trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);
  if(isNaN(d))return null;
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-t0)/86400000);
}
